<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 Support -->
    <meta charset="UTF-8" />
    <!-- IE Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme Color -->
    <meta name="theme-color" content="#050816" />
    <!-- Description -->
    <meta
      name="description"
      content="Amandeep Singh — AI & Data Systems Engineer. Machine learning research, data engineering and scalable web systems. Ex-DRDO."
    />
    <!-- Keywords -->
    <meta
      name="keywords"
      content="reactjs, react, porfolio-app, three-js, modern-ui/ux, js, javascript, html, css, tailwindcss"
    />
    <!-- Author -->
    <meta name="author" content="Amandeep Singh" />
    <link rel="author" href="https://github.com/DevxAman" />

    <!-- Icon -->
    <link rel="icon" type="image/png" href="/logo.png" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Color Schema -->
    <meta name="color-scheme" content="dark" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Amandeep Singh | AI & Data Systems Engineer" />
    <meta property="og:description" content="Machine learning research, data engineering and scalable web systems." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts (preconnect avoids a render-blocking CSS @import chain) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Title -->
    <title>Amandeep Singh | AI & Data Systems Engineer</title>
  </head>
  <body style="background:#050816">
    <noscript></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
